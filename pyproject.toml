# uv workspace root (ADR 0001). Members: pipeline/ now, api/ from phase 3.
[project]
name = "pitchlens-workspace"
version = "0.0.0"
description = "PitchLens monorepo workspace root"
requires-python = ">=3.12"
dependencies = ["pitchlens"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipeline"]

[tool.uv.sources]
pitchlens = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.11",
  "nbstripout>=0.7",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "ruff>=0.6",
]
# Exploration only (ADR 0005): `uv sync --group notebooks`, then `uv run jupyter lab`.
notebooks = [
  "jupyterlab>=4.2",
  "mplsoccer>=1.4",
  "pandas>=2.2",
  "statsbombpy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["pitchlens"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline/src", "pipeline/tests"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra --strict-markers"
