[project]
name = "pitchlens"
version = "0.1.0"
description = "PitchLens data pipeline: ingest, validate, model and publish football data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.12",
]

[project.scripts]
pitchlens = "pitchlens.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchlens"]
